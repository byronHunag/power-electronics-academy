  <script src="./content.js?v=3.4.0"></script>
  <script type="module">
(() => {
  'use strict';
  const original = window.POWER_ACADEMY_DATA || {modules:[], lessons:[], updates:[], next:null};
  const clone = x => JSON.parse(JSON.stringify(x));
  const DATA = clone(original);
  const LS_KEY = 'power_academy_v1_lessons';
  const LS_UPDATES = 'power_academy_v1_updates';
  try {
    const extra = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    for (const l of extra) {
      const index = DATA.lessons.findIndex(x=>x.id===l.id);
      if (index >= 0) DATA.lessons[index] = l; else DATA.lessons.push(l);
    }
    for (const update of JSON.parse(localStorage.getItem(LS_UPDATES)||'[]')) DATA.updates.unshift(update);
  } catch (error) { console.warn('local data unavailable',error); }
  DATA.lessons.sort((a,b)=>DATA.modules.findIndex(m=>m.id===a.module)-DATA.modules.findIndex(m=>m.id===b.module)||a.number-b.number);
  const $ = id => document.getElementById(id);
  const page = $('page');
  const chapterNav = $('chapterNav');
  const searchInput = $('searchInput');
  let expanded = 'mag';
  const icons = {pfc:'ϟ',mag:'◈',llc:'∿',flyback:'⟲'};
  const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mName = id => (DATA.modules.find(m=>m.id===id)||{}).name||id;
  const lessonsIn = id => DATA.lessons.filter(x=>x.module===id).sort((a,b)=>a.number-b.number);
  const latest = () => DATA.updates.map(u=>DATA.lessons.find(x=>x.id===u.lesson_id)).find(Boolean) || DATA.lessons.at(-1);
  const next = () => {
    for (const m of DATA.modules) {
      const current = lessonsIn(m.id);
      const number = current.length ? Math.max(...current.map(x=>x.number))+1 : 1;
      if (m.total && number > m.total) continue;
      return {module:m.id,number,title:DATA.next?.module===m.id&&DATA.next?.number===number?DATA.next.title:'待更新课程'};
    }
    return null;
  };
  const showToast = message => {
    const t=$('toast');t.textContent=message;t.classList.add('show');
    clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2800);
  };
  const closeNav=()=>{$('sidebar').classList.remove('open');$('shade').hidden=true};
  const navigate = hash => {location.hash=hash;render();closeNav();document.querySelector('main').scrollTo(0,0);window.scrollTo(0,0)};
  const para = t => String(t||'内容待补充。').split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('');
  const scenarios = {
    pfc:'85～264Vac输入 · 约400Vdc母线 · 600W～1kW CCM Boost PFC',
    mag:'高频电源磁性器件 · 参数计算、绕组、绝缘与样品测试',
    llc:'约400V母线半桥LLC · 60～93V、2～8A · 最大工作点744W',
    flyback:'65W反激案例 · 176～276Vac输入 · 目标65kHz · 输出按实际规格确定'
  };
  const safeReferences = refs => (Array.isArray(refs)?refs:[]).filter(r=>{
    try { return typeof r.title==='string' && new URL(r.url).protocol==='https:'; }
    catch { return false; }
  });
  function referencesCard(refs) {
    const items=safeReferences(refs);
    return items.length ? `<section class="card"><h2>原始资料与延伸阅读</h2><ul class="reference-list">${items.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a></li>`).join('')}</ul></section>` : '';
  }
  function nav() {
    const current=(location.hash.match(/^#\/course\/([^/?]+)/)||[])[1];
    chapterNav.innerHTML=DATA.modules.map(m=>{
      const ls=lessonsIn(m.id);
      const isOpen=expanded===m.id;
      const list=isOpen ? `<div class="lesson-nav">${ls.map(l=>`<button class="lesson-link ${current===l.id?'selected':''}" data-go="#/course/${l.id}"><span class="mini-num">${l.number}</span><span class="line">${esc(l.title)}</span></button>`).join('')}${next()?.module===m.id?`<button class="lesson-link" data-go="#/home"><span class="mini-num">＋</span><span class="line">第${next().number}课 · ${esc(next().title)}（待更新）</span></button>`:''}${!ls.length?'<div class="muted small" style="padding:9px 13px">尚未开始</div>':''}</div>`:'';
      return `<div class="module ${isOpen?'active':''}"><button class="module-head" data-expand="${m.id}"><span class="module-icon">${icons[m.id]}</span><span class="module-name"><strong>${esc(m.name)}</strong><small>${ls.length?`${ls.length}课已收录`:'待学习'}</small></span><span class="chevron">${isOpen?'▾':'▸'}</span></button>${list}</div>`;
    }).join('');
    chapterNav.querySelectorAll('[data-expand]').forEach(btn=>btn.onclick=()=>{expanded=expanded===btn.dataset.expand?'':btn.dataset.expand;nav()});
    chapterNav.querySelectorAll('[data-go]').forEach(btn=>btn.onclick=()=>navigate(btn.dataset.go));
  }
  function home() {
    const n=next();const count=DATA.lessons.length;
    const cards=DATA.modules.map(m=>{
      const ls=lessonsIn(m.id);const ratio = m.total?Math.min(100,Math.round(ls.length/m.total*100)):0;
      return `<button class="path-card" data-mod="${m.id}"><div class="path-icon">${icons[m.id]}</div><strong>${esc(m.name)}</strong><p>${esc(m.subtitle)}</p><div class="progress"><span style="width:${ratio}%"></span></div><div class="path-bottom"><span>${ls.length?`${ls.length} 课已收录`:'尚未开始'}</span><span>${m.total&&ls.length===m.total?'阶段课程完成':'查看章节 →'}</span></div></button>`;
    }).join('');
    const l=latest();
    page.innerHTML=`<section class="hero"><div class="eyebrow">POWER ELECTRONICS · 从原理到调试</div><h1>学会设计电源，更要学会分析波形。</h1><p>完整学习路径：PFC → 高频变压器 / 磁性器件 → LLC → Flyback。包含公式推导、计算实例、波形排查与复习答案，按PFC+LLC和65W反激两类场景展开。</p><button class="button button-accent" data-go="#/course/${l?.id||'pfc-01'}">继续浏览最近课程 ↗</button></section>
      <div class="stat-grid"><div class="stat-card"><div class="stat-label">已收录课程</div><div class="stat-number">${count}</div><div class="stat-label">四阶段工程课程持续扩充</div></div><div class="stat-card"><div class="stat-label">PFC 功率因数校正</div><div class="stat-number">${lessonsIn('pfc').length}<small style="font-size:13px;color:#8997aa"> / ${DATA.modules.find(m=>m.id==='pfc').total}课</small></div><div class="stat-label">CCM Boost与工程验证</div></div><div class="stat-card"><div class="stat-label">磁性器件 / LLC / Flyback</div><div class="stat-number">${lessonsIn('mag').length} / ${lessonsIn('llc').length} / ${lessonsIn('flyback').length}</div><div class="stat-label">课程收录数 · 目标 ${DATA.modules.find(m=>m.id==='mag').total} / ${DATA.modules.find(m=>m.id==='llc').total} / ${DATA.modules.find(m=>m.id==='flyback').total}</div></div></div>
      <div class="section-head"><h2>四阶段学习路径</h2><small>点击查看章节</small></div><div class="module-grid">${cards}</div>
      <div class="section-head"><h2>最近课程与下一步</h2></div><div class="card"><h3>最近收录 · ${esc(mName(l?.module))} 第${l?.number||0}课</h3><p>${esc(l?.title||'')}</p><div style="margin-top:17px"><button class="button button-outline" data-go="#/course/${l?.id}">打开课程内容</button></div></div>

  function bindSr(id) {
    const out=document.getElementById('srResult');if(!out)return;
    const val=x=>document.getElementById(x).value;
    function update(){
      if(id==='flyback-13'){const st=val('srState'),hi=val('srSide')==='high',vds=st==='off'?20+375/13.25:st==='diode'?-.7:st==='on'?-.1:0,vgs=st==='on'?9:0,vs=hi?20-vds:0,vd=vs+vds,vg=vs+vgs;out.textContent='VD '+vd.toFixed(2)+' V ｜ VS / IC GND '+vs.toFixed(2)+' V ｜ VG '+vg.toFixed(2)+' V ｜ VDS '+vds.toFixed(2)+' V ｜ VGS '+vgs.toFixed(2)+' V';}
      else {const max=+val('srMax'),min=+val('srMin'),sp=+val('srSpike'),r=+val('srR');if(![max,min,sp,r].every(Number.isFinite)||max<=0||min<=0||sp<0||r<=0||min>max){out.textContent='请输入合理的正值，最低母线不能高于最大母线。';return;}const pk=20+max/13.25+sp,D=265/(min+265),ds=1-D,di=13.25*min*D/(.002943*65000),avg=3.25/ds,iv=avg-di/2,ir=Math.sqrt(ds*(avg*avg+di*di/12));out.textContent='SR峰值应力 '+pk.toFixed(2)+' V；80%目标所需额定耐压 ≥ '+(pk/.8).toFixed(2)+' V；原边理论应力 '+(max+265).toFixed(2)+' V（未含尖峰）。'+(iv<=0?' 当前CCM假设不成立，请按DCM重新计算。':' CCM估算：D '+(D*100).toFixed(1)+'%；副边峰值 '+(avg+di/2).toFixed(2)+' A；谷值 '+iv.toFixed(2)+' A；RMS '+ir.toFixed(2)+' A；导通损耗 '+(ir*ir*r/1000).toFixed(3)+' W。');}
    }
    out.parentElement.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',update));update();
  }

  function magCalc(n) {
    const rows={
      1:[['N','匝数',10],['A','Ae (mm²)',100],['V','电压 V',10],['t','持续时间 µs',10]],
      3:[['N','匝数',28],['A','Ae (mm²)',200],['V','绕组方波幅值 V',200],['f','频率 kHz',100]],
      4:[['f','频率 kHz',65],['I','RMS电流 A',6.5],['J','电流密度 A/mm²',4],['d','单股裸铜直径 mm',0.2]],
      7:[['N','匝数',106],['A','Ae (mm²)',100],['L','目标电感 µH',2943],['I','峰值电流 A',0.825]],
      8:[['V','瞬时整流电压 V',120.2],['L','电感 µH',470],['f','频率 kHz',65],['I','该时刻平均电流 A',14.01]],
      9:[['Lr','Lr (µH)',30],['Lm','Lm (µH)',300],['Cr','Cr (nF)',68]],
      11:[['Pv','磁芯损耗密度 kW/m³',150],['Ve','有效体积 cm³',20],['I','绕组RMS A',8],['R','有效热态电阻 mΩ',80]]
    }[n];if(!rows)return '';
    return '<div class="worked-example"><h3>交互计算：改变参数，观察结果</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px">'+rows.map(a=>'<label style="font-size:12px;color:#536784">'+esc(a[1])+'<input type="number" step="any" min="0.000001" data-magnet="'+a[0]+'" value="'+a[2]+'" style="display:block;width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:5px"></label>').join('')+'</div><p id="magResult" style="margin-top:14px;font-weight:600"></p><p class="small muted">简化教学模型；饱和、温升、绝缘、波形和实际材料公差另行校核。</p></div>';
  }
  function bindMag(n){
    const out=document.getElementById('magResult');if(!out)return;
    const nodes=Array.from(out.parentElement.querySelectorAll('input[data-magnet]'));
    function update(){
      const v=Object.fromEntries(nodes.map(e=>[e.dataset.magnet,+e.value]));
      if(Object.values(v).some(x=>!Number.isFinite(x)||x<=0)){out.textContent='请输入正数。';return;}
      const fx=(x,m=3)=>x.toFixed(m);let t='';
      if(n===1)t='磁通变化 ΔB = '+fx(v.V*v.t/(v.N*v.A))+' T；ΔΦ = '+fx(v.V*v.t/v.N)+' µWb。';
      if(n===3){const B=v.V*250/(v.f*v.N*v.A);t='对称方波 Bpk = '+fx(B)+' T；ΔBpp = '+fx(2*B)+' T。'}
      if(n===4){const A=v.I/v.J,delta=Math.sqrt(1.724e-8/(Math.PI*v.f*1e3*4*Math.PI*1e-7))*1e3;t='铜趋肤深度 '+fx(delta)+' mm；裸铜面积 '+fx(A)+' mm²；至少 '+Math.ceil(A/(Math.PI*v.d*v.d/4))+' 股（未计绝缘、工艺）。'}
      if(n===7){const lg=4*Math.PI*1e-7*v.N*v.N*v.A*1e-6/(v.L*1e-6)*1000,B=v.L*v.I/(v.N*v.A);t='气隙主导等效总气隙 '+fx(lg)+' mm；AL '+fx(v.L*1000/v.N**2,1)+' nH/匝²；Bpk '+fx(B)+' T；储能 '+fx(.0005*v.L*v.I**2)+' mJ。'}
      if(n===8){if(v.V>=400){out.textContent='此Boost CCM估算要求瞬时Vin低于400V母线。';return;}const D=1-v.V/400,di=v.V*D*1000/(v.L*v.f);t='D = '+fx(D*100,1)+'%；ΔIL = '+fx(di)+' App；Ipk = '+fx(v.I+di/2)+' A；'+(v.I-di/2>0?'谷值 '+fx(v.I-di/2)+' A。':'谷值≤0，CCM模型不适用。');}
      if(n===9){const fr=1/(2*Math.PI*Math.sqrt(v.Lr*1e-6*v.Cr*1e-9))/1000,fm=1/(2*Math.PI*Math.sqrt((v.Lr+v.Lm)*1e-6*v.Cr*1e-9))/1000;t='fr = '+fx(fr,1)+' kHz；fm = '+fx(fm,1)+' kHz；Lm/Lr = '+fx(v.Lm/v.Lr,2)+'。';}
      if(n===11){const pc=v.Pv*v.Ve/1000,pu=v.I*v.I*v.R/1000;t='磁芯 '+fx(pc)+' W；绕组 '+fx(pu)+' W；小计 '+fx(pc+pu)+' W（未计其他损耗）。';}
      out.textContent=t;
    }
    nodes.forEach(e=>e.addEventListener('input',update));update();
  }

  function lessonPage(l) {
    expanded=l.module;
    const ls=lessonsIn(l.module),idx=ls.findIndex(x=>x.id===l.id),prev=ls[idx-1],nextLesson=ls[idx+1];
    const sections=[['core','01','核心原理与推导',para(l.summary)+studyBlock('推导、因果关系与适用边界',l.derivation)],['wave','02','关键电压 / 电流波形',`<div class="visual">${l.module==="mag"?magVisual(l.number):/^flyback-(13|14|15)$/.test(l.id)?srVisual(l.id):waveform(l.module)}</div><div style="height:10px"></div><p class="small muted" style="margin:8px 0 12px">上图为教学示意，不是实际材料曲线或实测波形；具体判断见下文。</p>${para(l.waveform)}${srCalc(l.id)}${l.module==="mag"?magCalc(l.number):""}`],['formula','03','重要公式',`<div class="formula-box">${(l.formula||[]).map(f=>`<div>${esc(f)}</div>`).join('')}</div>`],['select','04','设计、选型与计算实例',para(l.selection)+(l.worked_example?`<div class="worked-example"><h3>计算实例 · 先核对假设与单位</h3>${para(l.worked_example)}</div>`:'')],['debug','05','调试步骤与故障判断',para(l.debug)+(l.bench_steps?.length?`<div class="study-block"><h3>可复现的实操顺序</h3>${ordered(l.bench_steps)}</div>`:'')],['mistakes','06','常见错误',para(l.mistakes)],['interfaces','07','与前后级关系',para(l.interfaces)],['quiz','08','复习题',`<div>${(l.questions||[]).map((q,i)=>`<div class="question"><strong>${i+1}.</strong> ${esc(q)}</div>`).join('')}</div>${l.answers?.length?`<details class="review-answers"><summary>参考答案 · 建议先独立作答</summary>${ordered(l.answers)}</details>`:''}`]];
    page.innerHTML=`<div class="eyebrow">课程学习 · ${esc(mName(l.module))}</div><div class="course-header"><div><div class="lesson-id">第 ${l.number} 课</div><h1>${esc(l.title)}</h1></div><span class="status-chip ${l.status==='summary'?'':'badge-pending'}">${l.status==='summary'?'重点摘要':'工程讲义'}</span></div><div class="description">应用场景：${esc(l.application||scenarios[l.module]||'按本课给定条件')}</div><div class="note">${esc(l.source_note||'本课按工程化结构整理。')} 本页算例均需按实际规格复核；原始资料见文末。波形示意与测试计划不代表用户样机的实测结果。</div><div class="course-toc">${sections.map(s=>`<a href="#${s[0]}" data-anchor="${s[0]}">${s[2]}</a>`).join('')}</div>${sections.map(s=>`<section class="card" id="${s[0]}"><div class="eyebrow" style="margin-bottom:8px">${s[1]} / 08</div><h2>${s[2]}</h2>${s[3]}</section>`).join('')}${referencesCard(l.references)}<div class="nav-bottom"><button class="button button-outline" ${prev?'':'disabled'} data-go="${prev?`#/course/${prev.id}`:''}">← 上一课</button><button class="button button-accent" ${nextLesson?'':'disabled'} data-go="${nextLesson?`#/course/${nextLesson.id}`:''}">下一课 →</button></div><p class="footnote">课程内容可持续更新；实验涉及高压市电和400V母线，请使用合格隔离/差分测量设备，遵循实验室安全规范。</p>`;
    page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>x.dataset.go&&navigate(x.dataset.go));
    bindSr(l.id);
    if(l.module==="mag")bindMag(l.number);
    page.querySelectorAll('[data-anchor]').forEach(x=>x.onclick=e=>{e.preventDefault();const el=document.getElementById(x.dataset.anchor);el?.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',`#/course/${l.id}`)});
  }
  function logs() {
    page.innerHTML=`<div class="eyebrow">CHANGELOG</div><h1 class="page-title">课程更新记录</h1><p class="description">每次新增课程或修订内容，在这里保留日期、标题与更新摘要。静态网站部署后，通过更新内容文件并重新发布即可保留原网址。</p><div class="card">${DATA.updates.map(x=>`<div class="log-row"><div class="log-date">${esc(x.date)}</div><div><div class="log-title">${esc(x.title)}</div><div class="log-detail">${esc(x.detail)}</div></div></div>`).join('')}</div><div class="card"><h2>如何持续添加课程？</h2><ol><li>点击右上角“新增课程”，录入八部分课程内容。</li><li>保存后会在当前浏览器出现，并自动形成更新记录。</li><li>点击“导出更新文件”，下载新的 content.js。</li><li>将导出的content.js提交到GitHub仓库main分支，GitHub Actions会自动重新发布，所有设备通过同一个网址查看更新。</li></ol><p style="margin-top:12px">提示：本地保存不等于公网发布，也不会跨设备自动同步。</p></div>`;
  }
  function searchPage(q) {
    const normalized=q.trim().toLocaleLowerCase();
    const items=DATA.lessons.filter(x=>!normalized||Object.values(x).flatMap(v=>Array.isArray(v)?v:[v]).filter(v=>typeof v==='string'||typeof v==='number').join(' ').toLocaleLowerCase().includes(normalized));
    page.innerHTML=`<div class="eyebrow">SEARCH</div><h1 class="page-title">${normalized?`“${esc(q)}” 的搜索结果`:'浏览全部课程'}</h1><p class="description">找到 ${items.length} 门课程。支持查找公式、器件、波形、选型、调试和复习题中的关键词，例如“VGS”、“CS尖峰”、“漏感”、“ZVS”、“Bulk”。</p><div class="search-results">${items.map(x=>`<button class="result" data-go="#/course/${x.id}"><div><small>${esc(mName(x.module))} · 第${x.number}课</small><strong>${esc(x.title)}</strong></div><span style="color:#90a3c4">→</span></button>`).join('')||'<div class="empty">没有找到课程。试试其他技术关键词。</div>'}</div>`;
    page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>navigate(x.dataset.go));
  }
  function render() {
    const hash=location.hash||'#/home';
    if (hash.startsWith('#/course/')) {
      const id=hash.slice('#/course/'.length).split(/[?#]/)[0];
      const item=DATA.lessons.find(x=>x.id===id);
      if (item) lessonPage(item); else home();
    } else if (hash.startsWith('#/log')) logs();
    else if (hash.startsWith('#/search')) {
      const q=new URLSearchParams(hash.split('?')[1]||'').get('q')||'';
      searchInput.value=q;searchPage(q);
    }
    else home();
    nav();
    document.title=(location.hash.startsWith('#/course/') ? (DATA.lessons.find(x=>x.id===location.hash.slice(9))?.title||'课程')+' · ':'')+'电源系统工程学习平台';
  }
  const nextNumber = mod => Math.max(0,...lessonsIn(mod).map(l=>l.number))+1;
  function openEditor() {
    const f=$('editorForm');f.reset();
    const n=next(),current=DATA.lessons.find(l=>location.hash.split('?')[0]===`#/course/${l.id}`);
    const mod=n?.module||current?.module||DATA.modules[0]?.id;
    f.elements.module.value=mod;f.elements.number.value=n?.number||nextNumber(mod);
    f.elements.title.value=n&&n.title!=='待更新课程'?n.title:'';
    $('editor').showModal();
  }
  $('editorForm').elements.module.addEventListener('change',event=>{
    $('editorForm').elements.number.value=nextNumber(event.target.value);
    $('editorForm').elements.title.value='';
  });
  document.querySelector('.close-dialog').onclick=()=>$('editor').close();
  function exportContent() {
    const content=JSON.stringify(DATA,null,2);
    const blob=new Blob(['window.POWER_ACADEMY_DATA = '+content+';\n'],{type:'text/javascript;charset=utf-8'});
    const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='content.js';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),250);
    showToast('已导出 content.js，部署更新后公网可见');
  }
  $('editorForm').addEventListener('submit',event=>{
    event.preventDefault();
    const form=event.currentTarget,fd=new FormData(form),mod=String(fd.get('module')),num=Number(fd.get('number'));
    if(!Number.isInteger(num)||num<1||!DATA.modules.some(m=>m.id===mod))return showToast('请检查学习阶段和课次');
    const title=String(fd.get('title')||'').trim();if(!title)return showToast('请填写课程标题');
    const lesson={id:`${mod}-${String(num).padStart(2,'0')}`,module:mod,number:num,title,status:'full',summary:String(fd.get('summary')||''),formula:String(fd.get('formula')||'').split('\n').map(x=>x.trim()).filter(Boolean),waveform:String(fd.get('waveform')||''),selection:String(fd.get('selection')||''),debug:String(fd.get('debug')||''),mistakes:String(fd.get('mistakes')||''),interfaces:String(fd.get('interfaces')||''),questions:String(fd.get('questions')||'').split('\n').map(x=>x.trim()).filter(Boolean),source_note:'本地新增课程，部署后可公开浏览。'};
    const idx=DATA.lessons.findIndex(x=>x.id===lesson.id);
    if(idx>=0)return showToast('此课次已存在，请选择新的课次，已有内容不会被覆盖');
    DATA.lessons.push(lesson);
    DATA.lessons.sort((a,b)=>DATA.modules.findIndex(m=>m.id===a.module)-DATA.modules.findIndex(m=>m.id===b.module)||a.number-b.number);
    const newUpdate={date:new Date().toLocaleDateString('sv-SE'),title:`${mName(mod)} 第${num}课：${title}`,lesson_id:lesson.id,detail:'新增课程内容，包含核心原理、公式、波形、调试与复习题。'};
    DATA.updates.unshift(newUpdate);
    try {
      const extra=DATA.lessons.filter(x=>{const orig=original.lessons.find(y=>y.id===x.id);return !orig||JSON.stringify(orig)!==JSON.stringify(x)});
      localStorage.setItem(LS_KEY,JSON.stringify(extra));
      localStorage.setItem(LS_UPDATES,JSON.stringify(DATA.updates.slice(0,100).filter(x=>!original.updates.some(y=>JSON.stringify(x)===JSON.stringify(y)))));
    } catch(err) {showToast('浏览器存储失败，请导出内容文件备份');}
    $('editor').close();form.reset();showToast('课程已保存到本机浏览器');navigate(`#/course/${lesson.id}`);
  });
  $('addButton').onclick=openEditor;
  $('exportButton').onclick=exportContent;
  $('logButton').onclick=()=>navigate('#/log');
  $('menuToggle').onclick=()=>{$('sidebar').classList.toggle('open');$('shade').hidden=!$('sidebar').classList.contains('open')};
  $('shade').onclick=closeNav;
  const searchHash = () => `#/search?q=${encodeURIComponent(searchInput.value.trim())}`;
  searchInput.addEventListener('input',()=>{
    if(searchInput.value.trim()||location.hash.startsWith('#/search')){
      history.replaceState(null,'',searchHash());render();
    }
  });
  searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchInput.value='';navigate('#/home');searchInput.blur()}if(e.key==='Enter'){e.preventDefault();navigate(searchHash())}});
  window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!$('editor').open){e.preventDefault();searchInput.focus()}});
  window.addEventListener('hashchange',render);
  render();
})();

    <form method="dialog" class="editor-inner" id="editorForm">
      <div class="dialog-head"><div><div class="eyebrow">新增课程</div><h2>更新学习内容</h2></div><button type="button" class="icon-button close-dialog" aria-label="关闭">✕</button></div>
      <p class="muted small">新课程先保存到本机浏览器。点击“导出更新文件”备份，再提交到知识库仓库发布后，其他设备才能看到。新增课次不会覆盖已有内容。</p>
      <div class="editor-grid">
        <label>学习阶段<select name="module" required><option value="mag">高频变压器 / 磁性器件</option><option value="pfc">PFC</option><option value="llc">LLC</option><option value="flyback">Flyback</option></select></label>
        <label>第几课<input name="number" type="number" min="1" value="7" required /></label>
      </div>
      <label>标题<input name="title" placeholder="例如：气隙设计、励磁电感与储能" required /></label>
      <label>核心原理<textarea name="summary" rows="3" placeholder="本节核心原理"></textarea></label>
      <label>重要公式<textarea name="formula" rows="2" placeholder="每行一个公式"></textarea></label>
      <label>关键波形<textarea name="waveform" rows="2" placeholder="正常波形与异常现象"></textarea></label>
      <label>设计与选型<textarea name="selection" rows="2" placeholder="设计参数和器件选型"></textarea></label>
      <label>故障排查<textarea name="debug" rows="2" placeholder="遇到波形异常先查什么"></textarea></label>
      <label>常见错误<textarea name="mistakes" rows="2" placeholder="容易犯的错误"></textarea></label>
      <label>与前后级关系<textarea name="interfaces" rows="2" placeholder="PFC、LLC与Flyback之间的关系"></textarea></label>
      <label>复习题<textarea name="questions" rows="3" placeholder="一行一道题，建议3～5道"></textarea></label>
      <div class="form-actions"><button type="button" id="exportButton" class="button button-outline">导出更新文件</button><button type="submit" class="button button-accent">保存本机课程</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
