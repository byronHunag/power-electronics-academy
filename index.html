  <script src="./content.js"></script>
  <script type="module">
(() => {
  'use strict';
  const original = window.POWER_ACADEMY_DATA || {modules:[], lessons:[], updates:[], next:null};
  const clone = x => JSON.parse(JSON.stringify(x));
  const DATA = clone(original);
  const LS_KEY = 'power_academy_v1_lessons';
  const LS_UPDATES = 'power_academy_v1_updates';
  try {
    const extra = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    for (const l of extra) {
      const index = DATA.lessons.findIndex(x=>x.id===l.id);
      if (index >= 0) DATA.lessons[index] = l; else DATA.lessons.push(l);
    }
    for (const update of JSON.parse(localStorage.getItem(LS_UPDATES)||'[]')) DATA.updates.unshift(update);
  } catch (error) { console.warn('local data unavailable',error); }
  DATA.lessons.sort((a,b)=>DATA.modules.findIndex(m=>m.id===a.module)-DATA.modules.findIndex(m=>m.id===b.module)||a.number-b.number);
  const $ = id => document.getElementById(id);
  const page = $('page');
  const chapterNav = $('chapterNav');
  const searchInput = $('searchInput');
  let expanded = 'mag';
  const icons = {pfc:'ϟ',mag:'◈',llc:'∿',flyback:'⟲'};
  const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mName = id => (DATA.modules.find(m=>m.id===id)||{}).name||id;
  const lessonsIn = id => DATA.lessons.filter(x=>x.module===id).sort((a,b)=>a.number-b.number);
  const latest = () => DATA.lessons.find(x=>x.id===DATA.updates[0]?.lesson_id) || DATA.lessons.at(-1);
  const next = () => {
    for (const m of DATA.modules) {
      const current = lessonsIn(m.id);
      const number = current.length ? Math.max(...current.map(x=>x.number))+1 : 1;
      if (m.total && number > m.total) continue;
      return {module:m.id,number,title:DATA.next?.module===m.id&&DATA.next?.number===number?DATA.next.title:'待更新课程'};
    }
    return null;
  };
  const showToast = message => {
    const t=$('toast');t.textContent=message;t.classList.add('show');
    clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2800);
  };
  const closeNav=()=>{$('sidebar').classList.remove('open');$('shade').hidden=true};
  const navigate = hash => {location.hash=hash;render();closeNav();document.querySelector('main').scrollTo(0,0);window.scrollTo(0,0)};
  const para = t => `<p>${esc(t||'内容待补充。')}</p>`;
  function nav() {
    const current=(location.hash.match(/^#\/course\/([^/?]+)/)||[])[1];
    chapterNav.innerHTML=DATA.modules.map(m=>{
      const ls=lessonsIn(m.id);
      const isOpen=expanded===m.id;
      const list=isOpen ? `<div class="lesson-nav">${ls.map(l=>`<button class="lesson-link ${current===l.id?'selected':''}" data-go="#/course/${l.id}"><span class="mini-num">${l.number}</span><span class="line">${esc(l.title)}</span></button>`).join('')}${next()?.module===m.id?`<button class="lesson-link" data-go="#/home"><span class="mini-num">＋</span><span class="line">第${next().number}课 · ${esc(next().title)}（待更新）</span></button>`:''}${!ls.length?'<div class="muted small" style="padding:9px 13px">尚未开始</div>':''}</div>`:'';
      return `<div class="module ${isOpen?'active':''}"><button class="module-head" data-expand="${m.id}"><span class="module-icon">${icons[m.id]}</span><span class="module-name"><strong>${esc(m.name)}</strong><small>${ls.length?`${ls.length}课已收录`:'待学习'}</small></span><span class="chevron">${isOpen?'▾':'▸'}</span></button>${list}</div>`;
    }).join('');
    chapterNav.querySelectorAll('[data-expand]').forEach(btn=>btn.onclick=()=>{expanded=expanded===btn.dataset.expand?'':btn.dataset.expand;nav()});
    chapterNav.querySelectorAll('[data-go]').forEach(btn=>btn.onclick=()=>navigate(btn.dataset.go));
  }
  function home() {
    const n=next();const count=DATA.lessons.length;
    const cards=DATA.modules.map(m=>{
      const ls=lessonsIn(m.id);const ratio = m.total?Math.min(100,Math.round(ls.length/m.total*100)):0;
      return `<button class="path-card" data-mod="${m.id}"><div class="path-icon">${icons[m.id]}</div><strong>${esc(m.name)}</strong><p>${esc(m.subtitle)}</p><div class="progress"><span style="width:${ratio}%"></span></div><div class="path-bottom"><span>${ls.length?`${ls.length} 课已收录`:'尚未开始'}</span><span>${m.total&&ls.length===m.total?'阶段课程完成':'查看章节 →'}</span></div></button>`;
    }).join('');
    const l=latest();
    page.innerHTML=`<section class="hero"><div class="eyebrow">POWER ELECTRONICS · 从原理到调试</div><h1>学会设计电源，更要学会分析波形。</h1><p>完整学习路径：PFC → 高频变压器 / 磁性器件 → LLC → Flyback。以85～264Vac、400V母线、600W～1kW工程应用贯穿课程。</p><button class="button button-accent" data-go="#/course/${l?.id||'pfc-01'}">继续浏览最近课程 ↗</button></section>
      <div class="stat-grid"><div class="stat-card"><div class="stat-label">已收录课程</div><div class="stat-number">${count}</div><div class="stat-label">四阶段工程课程持续扩充</div></div><div class="stat-card"><div class="stat-label">PFC 功率因数校正</div><div class="stat-number">${lessonsIn('pfc').length}<small style="font-size:13px;color:#8997aa"> / 22课</small></div><div class="stat-label">CCM Boost与工程验证</div></div><div class="stat-card"><div class="stat-label">磁性器件 / LLC / Flyback</div><div class="stat-number">${lessonsIn('mag').length} / ${lessonsIn('llc').length} / ${lessonsIn('flyback').length}</div><div class="stat-label">课程收录数 · 目标 12 / 16 / 12</div></div></div>
      <div class="section-head"><h2>四阶段学习路径</h2><small>点击查看章节</small></div><div class="module-grid">${cards}</div>
      <div class="section-head"><h2>最近课程与下一步</h2></div><div class="card"><h3>最近收录 · ${esc(mName(l?.module))} 第${l?.number||0}课</h3><p>${esc(l?.title||'')}</p><div style="margin-top:17px"><button class="button button-outline" data-go="#/course/${l?.id}">打开课程内容</button></div></div>
      <div class="card"><h3>下一课 · ${esc(mName(n?.module))} 第${n?.number||'—'}课</h3><p>${esc(n?.title||'完成全部课程')}。新增课程后会自动出现在章节导航与更新记录中。</p><div style="margin-top:17px"><button class="button button-outline" id="homeAdd">＋ 录入新课程</button></div></div>
      <p class="footnote">说明：本站采用静态网页架构，课程数据独立保存在content.js。新增课程先保存到当前浏览器；导出content.js后替换GitHub仓库中的同名文件，GitHub Actions会自动重新发布。浏览器本地保存不等于公网同步。</p>`;
    page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>navigate(x.dataset.go));
    page.querySelectorAll('[data-mod]').forEach(x=>x.onclick=()=>{expanded=x.dataset.mod;nav(); const l=lessonsIn(x.dataset.mod)[0];navigate(l?`#/course/${l.id}`:'#/home')});
    $('homeAdd').onclick=()=>openEditor();
  }
  function waveform(m) {
    if (m==='pfc') return `<svg viewBox="0 0 700 212" role="img" aria-label="Boost PFC栅极、电感电流和母线纹波示意"><g stroke="#dce3ef"><path d="M66 38H685M66 110H685M66 177H685"/></g><g fill="#60728d" font-size="15"><text x="12" y="44">VGS</text><text x="12" y="117">IL</text><text x="12" y="184">VBUS</text></g><path d="M70 28H125V50H175V28H235V50H288V28H355V50H405V28H468V50H530V28H589V50H650" stroke="#2b6de7" stroke-width="3" fill="none"/><path d="M70 121L100 95L130 121L160 94L190 121L220 93L250 121L280 94L310 121L340 95L370 121L400 96L430 121L460 97L490 121L520 98L550 121L580 100L610 121L640 102" stroke="#17a18a" stroke-width="2.5" fill="none"/><path d="M70 174Q155 166 230 174T390 174T550 174T680 174" stroke="#d88a30" stroke-width="2.5" fill="none"/><text x="452" y="204" fill="#8c97a8" font-size="13">相对波形示意，非同一时间比例</text></svg>`;
    if (m==='mag') return `<svg viewBox="0 0 700 212" role="img" aria-label="磁性器件原边电压、磁通密度和励磁电流示意"><g stroke="#dce3ef"><path d="M66 38H685M66 110H685M66 177H685"/></g><g fill="#60728d" font-size="15"><text x="12" y="44">Vpri</text><text x="12" y="117">B</text><text x="12" y="184">iLm</text></g><path d="M70 25H220V53H370V25H520V53H670" stroke="#2b6de7" stroke-width="3" fill="none"/><path d="M70 135L220 85L370 135L520 85L670 135" stroke="#17a18a" stroke-width="2.5" fill="none"/><path d="M70 188L220 165L370 188L520 165L670 188" stroke="#d88a30" stroke-width="2.5" fill="none"/><text x="466" y="205" fill="#8c97a8" font-size="13">理想化磁通/电流示意</text></svg>`;
    if (m==='llc') return `<svg viewBox="0 0 700 212" role="img" aria-label="半桥LLC中点电压、谐振电流和励磁电流示意"><g stroke="#dce3ef"><path d="M66 38H685M66 110H685M66 177H685"/></g><g fill="#60728d" font-size="15"><text x="12" y="44">VHB</text><text x="12" y="117">iLr</text><text x="12" y="184">iLm</text></g><path d="M70 25H220V53H370V25H520V53H670" stroke="#2b6de7" stroke-width="3" fill="none"/><path d="M70 110C120 62 170 62 220 110S320 158 370 110S470 62 520 110S620 158 670 110" stroke="#17a18a" stroke-width="2.5" fill="none"/><path d="M70 188L220 165L370 188L520 165L670 188" stroke="#d88a30" stroke-width="2.5" fill="none"/><text x="466" y="205" fill="#8c97a8" font-size="13">实际相位和幅值随负载/频率变化</text></svg>`;
    return `<svg viewBox="0 0 700 212" role="img" aria-label="反激栅极、原边电流和MOS漏源电压示意"><g stroke="#dce3ef"><path d="M66 38H685M66 110H685M66 177H685"/></g><g fill="#60728d" font-size="15"><text x="12" y="44">VGS</text><text x="12" y="117">Ip</text><text x="12" y="184">VDS</text></g><path d="M70 28H155V50H240V28H325V50H410V28H495V50H580V28H670" stroke="#2b6de7" stroke-width="3" fill="none"/><path d="M70 132L155 90L155 132L240 90L240 132L325 90L325 132L410 90L410 132L495 90L495 132L580 90L580 132L670 132" stroke="#17a18a" stroke-width="2.5" fill="none"/><path d="M70 190L155 190L155 145Q190 132 240 145L240 190L325 190L325 145Q360 132 410 145L410 190L495 190L495 145Q530 132 580 145L580 190L670 190" stroke="#d88a30" stroke-width="2.5" fill="none"/><text x="466" y="205" fill="#8c97a8" font-size="13">原边储能与副边退磁时序示意</text></svg>`;
  }
  function lessonPage(l) {
    expanded=l.module;
    const ls=lessonsIn(l.module),idx=ls.findIndex(x=>x.id===l.id),prev=ls[idx-1],nextLesson=ls[idx+1];
    const sections=[['core','01','核心原理',para(l.summary)],['wave','02','关键电压 / 电流波形',`<div class="visual">${waveform(l.module)}</div><div style="height:10px"></div>${para(l.waveform)}`],['formula','03','重要公式',`<div class="formula-box">${(l.formula||[]).map(f=>`<div>${esc(f)}</div>`).join('')}</div>`],['select','04','实际设计 / 选型',para(l.selection)],['debug','05','调试注意事项与故障判断',para(l.debug)],['mistakes','06','常见错误',para(l.mistakes)],['interfaces','07','与前后级关系',para(l.interfaces)],['quiz','08','复习题',`<div>${(l.questions||[]).map((q,i)=>`<div class="question"><strong>${i+1}.</strong> ${esc(q)}</div>`).join('')}</div>`]];
    page.innerHTML=`<div class="eyebrow">课程学习 · ${esc(mName(l.module))}</div><div class="course-header"><div><div class="lesson-id">第 ${l.number} 课</div><h1>${esc(l.title)}</h1></div><span class="status-chip ${l.status==='summary'?'':'badge-pending'}">${l.status==='summary'?'重点摘要':'工程讲义'}</span></div><div class="description">应用场景：85～264Vac输入 · 400Vdc母线 · 600W～1kW PFC+LLC</div><div class="note">${esc(l.source_note||'本课按工程化结构整理。')} 本页面提供可检索的知识整理版；若需完整推导或原始测试图，应补录相应课程PDF内容。</div><div class="course-toc">${sections.map(s=>`<a href="#${s[0]}" data-anchor="${s[0]}">${s[2]}</a>`).join('')}</div>${sections.map(s=>`<section class="card" id="${s[0]}"><div class="eyebrow" style="margin-bottom:8px">${s[1]} / 08</div><h2>${s[2]}</h2>${s[3]}</section>`).join('')}<div class="nav-bottom"><button class="button button-outline" ${prev?'':'disabled'} data-go="${prev?`#/course/${prev.id}`:''}">← 上一课</button><button class="button button-accent" ${nextLesson?'':'disabled'} data-go="${nextLesson?`#/course/${nextLesson.id}`:''}">下一课 →</button></div><p class="footnote">课程内容可持续更新；实验涉及高压市电和400V母线，请使用合格隔离/差分测量设备，遵循实验室安全规范。</p>`;
    page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>x.dataset.go&&navigate(x.dataset.go));
    page.querySelectorAll('[data-anchor]').forEach(x=>x.onclick=e=>{e.preventDefault();const el=document.getElementById(x.dataset.anchor);el?.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',`#/course/${l.id}`)});
  }
  function logs() {
    page.innerHTML=`<div class="eyebrow">CHANGELOG</div><h1 class="page-title">课程更新记录</h1><p class="description">每次新增课程或修订内容，在这里保留日期、标题与更新摘要。静态网站部署后，通过更新内容文件并重新发布即可保留原网址。</p><div class="card">${DATA.updates.map(x=>`<div class="log-row"><div class="log-date">${esc(x.date)}</div><div><div class="log-title">${esc(x.title)}</div><div class="log-detail">${esc(x.detail)}</div></div></div>`).join('')}</div><div class="card"><h2>如何持续添加课程？</h2><ol><li>点击右上角“新增课程”，录入八部分课程内容。</li><li>保存后会在当前浏览器出现，并自动形成更新记录。</li><li>点击“导出更新文件”，下载新的 content.js。</li><li>将导出的content.js提交到GitHub仓库main分支，GitHub Actions会自动重新发布，所有设备通过同一个网址查看更新。</li></ol><p style="margin-top:12px">提示：本地保存不等于公网发布，也不会跨设备自动同步。</p></div>`;
  }
  function searchPage(q) {
    const normalized=q.trim().toLocaleLowerCase();
    const items=DATA.lessons.filter(x=>!normalized||Object.values(x).flatMap(v=>Array.isArray(v)?v:[v]).filter(v=>typeof v==='string'||typeof v==='number').join(' ').toLocaleLowerCase().includes(normalized));
    page.innerHTML=`<div class="eyebrow">SEARCH</div><h1 class="page-title">${normalized?`“${esc(q)}” 的搜索结果`:'浏览全部课程'}</h1><p class="description">找到 ${items.length} 门课程。支持查找公式、器件、波形、选型、调试和复习题中的关键词，例如“VGS”、“CS尖峰”、“漏感”、“ZVS”、“Bulk”。</p><div class="search-results">${items.map(x=>`<button class="result" data-go="#/course/${x.id}"><div><small>${esc(mName(x.module))} · 第${x.number}课</small><strong>${esc(x.title)}</strong></div><span style="color:#90a3c4">→</span></button>`).join('')||'<div class="empty">没有找到课程。试试其他技术关键词。</div>'}</div>`;
    page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>navigate(x.dataset.go));
  }
  function render() {
    const hash=location.hash||'#/home';
    if (hash.startsWith('#/course/')) {
      const id=hash.slice('#/course/'.length).split(/[?#]/)[0];
      const item=DATA.lessons.find(x=>x.id===id);
      if (item) lessonPage(item); else home();
    } else if (hash.startsWith('#/log')) logs();
    else if (hash.startsWith('#/search')) searchPage(searchInput.value);
    else home();
    nav();
    document.title=(location.hash.startsWith('#/course/') ? (DATA.lessons.find(x=>x.id===location.hash.slice(9))?.title||'课程')+' · ':'')+'电源系统工程学习平台';
  }
  function openEditor() { $('editor').showModal(); const n=next();if(n){const f=$('editorForm');f.elements.module.value=n.module;f.elements.number.value=n.number;f.elements.title.value=n.title==='待更新课程'?'':n.title;} }
  function exportContent() {
    const content=JSON.stringify(DATA,null,2);
    const blob=new Blob(['window.POWER_ACADEMY_DATA = '+content+';\n'],{type:'text/javascript;charset=utf-8'});
    const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='content.js';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),250);
    showToast('已导出 content.js，部署更新后公网可见');
  }
  $('editorForm').addEventListener('submit',event=>{
    event.preventDefault();
    const form=event.currentTarget,fd=new FormData(form),mod=String(fd.get('module')),num=Number(fd.get('number'));
    if(!Number.isInteger(num)||num<1||!DATA.modules.some(m=>m.id===mod))return showToast('请检查学习阶段和课次');
    const title=String(fd.get('title')||'').trim();if(!title)return showToast('请填写课程标题');
    const lesson={id:`${mod}-${String(num).padStart(2,'0')}`,module:mod,number:num,title,status:'full',summary:String(fd.get('summary')||''),formula:String(fd.get('formula')||'').split('\n').map(x=>x.trim()).filter(Boolean),waveform:String(fd.get('waveform')||''),selection:String(fd.get('selection')||''),debug:String(fd.get('debug')||''),mistakes:String(fd.get('mistakes')||''),interfaces:String(fd.get('interfaces')||''),questions:String(fd.get('questions')||'').split('\n').map(x=>x.trim()).filter(Boolean),source_note:'本地新增课程，部署后可公开浏览。'};
    const idx=DATA.lessons.findIndex(x=>x.id===lesson.id);if(idx>=0)DATA.lessons[idx]=lesson;else DATA.lessons.push(lesson);
    DATA.lessons.sort((a,b)=>DATA.modules.findIndex(m=>m.id===a.module)-DATA.modules.findIndex(m=>m.id===b.module)||a.number-b.number);
    const newUpdate={date:new Date().toLocaleDateString('sv-SE'),title:`${mName(mod)} 第${num}课：${title}`,detail:idx>=0?'修订课程内容、公式与调试记录。':'新增课程内容，包含核心原理、公式、波形、调试与复习题。'};
    DATA.updates.unshift(newUpdate);
    try {
      const extra=DATA.lessons.filter(x=>{const orig=original.lessons.find(y=>y.id===x.id);return !orig||JSON.stringify(orig)!==JSON.stringify(x)});
      localStorage.setItem(LS_KEY,JSON.stringify(extra));
      localStorage.setItem(LS_UPDATES,JSON.stringify(DATA.updates.slice(0,100).filter(x=>!original.updates.some(y=>JSON.stringify(x)===JSON.stringify(y)))));
    } catch(err) {showToast('浏览器存储失败，请导出内容文件备份');}
    $('editor').close();form.reset();showToast('课程已保存到本机浏览器');navigate(`#/course/${lesson.id}`);
  });
  $('addButton').onclick=openEditor;
  $('exportButton').onclick=exportContent;
  $('logButton').onclick=()=>navigate('#/log');
  $('menuToggle').onclick=()=>{$('sidebar').classList.toggle('open');$('shade').hidden=!$('sidebar').classList.contains('open')};
  $('shade').onclick=closeNav;
  searchInput.addEventListener('input',()=>{if(searchInput.value.trim()){if(!location.hash.startsWith('#/search'))location.hash='#/search';else searchPage(searchInput.value)}else if(location.hash.startsWith('#/search'))searchPage('')});
  searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchInput.value='';navigate('#/home');searchInput.blur()}if(e.key==='Enter'){e.preventDefault();navigate('#/search')}});
  window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!$('editor').open){e.preventDefault();searchInput.focus()}});
  window.addEventListener('hashchange',render);
  render();
})();
  </script>

  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
  <header class="topbar">
    <button class="icon-button hamburger" id="menuToggle" aria-label="展开章节导航">☰</button>
    <a class="brand" href="#/home" aria-label="电源系统工程学习平台首页">
      <span class="brand-mark">⚡</span>
      <span class="brand-label"><strong>电源系统工程学习平台</strong><small>POWER ELECTRONICS ACADEMY</small></span>
    </a>
    <div class="header-actions">
      <div class="searchbox"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索课程、公式、故障关键词…" aria-label="搜索课程" /><kbd>/</kbd></div>
      <button class="top-link" id="logButton" type="button">更新记录</button>
      <button class="button button-accent" id="addButton" type="button">＋ 新增课程</button>
    </div>
  </header>
  <div class="shell">
    <aside id="sidebar" class="sidebar"><div class="nav-scroller">
      <div class="sidebar-label">学习路径 <span>4 个阶段</span></div>
      <div class="chapter-nav" id="chapterNav"></div>
      <div class="sidebar-foot"><div class="tiny-dot"></div><span>离线可查看 · 静态网页版</span></div>
    </div></aside>
    <main class="main" id="main" tabindex="-1"><div class="main-inner" id="page"></div></main>
  </div>
  <div class="shade" id="shade" hidden></div>
  <dialog id="editor" class="editor">
    <form method="dialog" class="editor-inner" id="editorForm">
      <div class="dialog-head"><div><div class="eyebrow">新增课程</div><h2>更新学习内容</h2></div><button value="cancel" class="icon-button close-dialog" aria-label="关闭">✕</button></div>
      <p class="muted small">新课程先保存到本机浏览器。点击“导出更新文件”，将新生成的 content.js 上传到已部署的网站，才能让其他设备看到更新。</p>
      <div class="editor-grid">
        <label>学习阶段<select name="module" required><option value="mag">高频变压器 / 磁性器件</option><option value="pfc">PFC</option><option value="llc">LLC</option><option value="flyback">Flyback</option></select></label>
        <label>第几课<input name="number" type="number" min="1" value="7" required /></label>
      </div>
      <label>标题<input name="title" placeholder="例如：气隙设计、励磁电感与储能" required /></label>
      <label>核心原理<textarea name="summary" rows="3" placeholder="本节核心原理"></textarea></label>
      <label>重要公式<textarea name="formula" rows="2" placeholder="每行一个公式"></textarea></label>
      <label>关键波形<textarea name="waveform" rows="2" placeholder="正常波形与异常现象"></textarea></label>
      <label>设计与选型<textarea name="selection" rows="2" placeholder="设计参数和器件选型"></textarea></label>
      <label>故障排查<textarea name="debug" rows="2" placeholder="遇到波形异常先查什么"></textarea></label>
      <label>常见错误<textarea name="mistakes" rows="2" placeholder="容易犯的错误"></textarea></label>
      <label>与前后级关系<textarea name="interfaces" rows="2" placeholder="PFC、LLC与Flyback之间的关系"></textarea></label>
      <label>复习题<textarea name="questions" rows="3" placeholder="一行一道题，建议3～5道"></textarea></label>
      <div class="form-actions"><button type="button" id="exportButton" class="button button-outline">导出更新文件</button><button type="submit" class="button button-accent">保存本机课程</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
